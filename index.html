<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOOT HUNTERS CC — 黑晶礦坑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;900&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=21">
</head>
<body>
<div id="app">

  <!-- 標題畫面 -->
  <section id="title" class="screen active">
    <canvas id="title-cv"></canvas>
    <div class="title-box">
      <img class="emblem" id="t-emblem" alt="">
      <div class="logo"><span class="l1">LOOT</span><span class="l2">HUNTERS</span><span class="cc">CC</span></div>
      <div class="logo-sub"><i></i>黑 晶 礦 坑<i></i></div>
      <div class="title-tag">放置刷寶・深度配裝・看準時機出手</div>
      <div class="title-btns" id="title-btns"></div>
      <div class="title-foot">滑鼠點技能可手動施放・數字鍵 1–8 也可以</div>
    </div>
  </section>

  <!-- 營地 -->
  <section id="camp" class="screen">
    <header class="topbar">
      <div class="brand">LOOT HUNTERS <small>CC</small></div>
      <div class="top-res">
        <div class="res gold"><i class="coin"></i><b id="t-gold">0</b></div>
        <div class="res"><span>等級</span><b id="t-level">1</b></div>
        <div class="xpbar"><div id="t-xp"></div><span id="t-xptext"></span></div>
      </div>
      <div class="top-actions">
        <button class="ghost" data-act="music" id="btn-music" title="點一下切換音樂音量">音樂：中</button>
        <button class="ghost" data-act="sound" id="btn-sound" title="點一下切換音效音量">音效：大</button>
        <button class="ghost" data-act="dmgNum" id="btn-dmgnum" title="點一下切換傷害數字：全部／只看技能／關閉">數字：全部</button>
        <button class="ghost" data-act="menu">選單</button>
      </div>
    </header>
    <div class="camp-body">
      <aside class="hero-panel">
        <canvas id="camp-cv" width="300" height="190"></canvas>
        <div id="hero-summary"></div>
      </aside>
      <main class="camp-main">
        <nav class="tabs" id="tabs">
          <button data-tab="expedition" class="on">出征</button>
          <button data-tab="gear">裝備與倉庫</button>
          <button data-tab="stars">角色與星盤</button>
          <button data-tab="forge">工坊</button>
          <button data-tab="codex">寶物圖鑑</button>
          <button data-tab="auto">掛機設定</button>
          <button data-tab="records">紀錄</button>
        </nav>
        <div id="tab-body" class="tab-body"></div>
      </main>
    </div>
  </section>

  <!-- 地城 -->
  <section id="dungeon" class="screen">
    <div class="hud-top">
      <div class="hud-left">
        <div class="dn-name" id="h-name">黑晶礦坑・普通</div>
        <div class="dn-floor" id="h-floor">第 1 / 5 層</div>
        <div class="killbar"><div id="h-kill"></div><span id="h-killtext"></span></div>
        <div class="dn-mobs" id="h-mobs">場上 0 隻</div>
      </div>
      <div class="hud-controls">
        <div class="seg" id="h-mode"><button data-act="mode" data-v="active">主動</button><button data-act="mode" data-v="idle">掛機</button></div>
        <button class="tog" id="h-auto" data-act="autocast">自動施法：開</button>
        <div class="seg" id="h-speed"><button data-act="speed" data-v="1">1×</button><button data-act="speed" data-v="2">2×</button><button data-act="speed" data-v="3">3×</button><button data-act="speed" data-v="4">4×</button></div>
        <button class="tog" id="h-retreat" data-act="retreatAfter">本層清完撤退</button>
      </div>
    </div>
    <div class="stage-wrap">
      <div class="stage" id="stage">
        <canvas id="cv"></canvas>
        <canvas id="minimap" class="minimap" title="小地圖：亮色是探索過的地方，紅點是附近的怪物"></canvas>
        <div class="bossbar" id="h-boss"><div class="bb-name"></div><div class="bb-bar"><div></div></div><div class="bb-move"></div></div>
        <div class="toasts" id="toasts"></div>
        <div class="tray" id="tray"><div class="tray-title">待整理</div><div class="tray-gems" id="tray-gems"></div></div>
        <div class="overlay-msg" id="ov-msg"></div>
      </div>
    </div>
    <div class="hud-bottom">
      <div class="orb hp"><div class="orb-fill" id="o-hp"></div><i class="bub" style="left:30%;animation-delay:0s"></i><i class="bub" style="left:60%;animation-delay:1.3s"></i><div class="orb-gloss"></div><span id="o-hptext"></span></div>
      <div class="pot red" title="紅水（自動飲用）"><i></i><b id="p-red">0</b></div>
      <div class="skillbar-wrap">
        <div class="hxp"><div id="h-xp"></div></div>
        <div class="skillbar" id="skillbar"></div>
      </div>
      <div class="pot blue" title="藍水（自動飲用）"><i></i><b id="p-blue">0</b></div>
      <div class="orb mp"><div class="orb-fill" id="o-mp"></div><i class="bub" style="left:40%;animation-delay:.6s"></i><i class="bub" style="left:68%;animation-delay:2s"></i><div class="orb-gloss"></div><span id="o-mptext"></span></div>
    </div>
  </section>

  <div id="modal-root"></div>
  <div id="tip" class="tip-float"></div>
  <div id="drag-ghost"></div>
</div>

<script>window.LH_VIEW = { hero: 1.2 }; // 主角在地城裡放大 1.2 倍（大頭比較看得清楚）</script>
<script src="js/core.js?v=21"></script>
<script src="js/data.js?v=21"></script>
<script src="js/items.js?v=21"></script>
<script src="js/character.js?v=21"></script>
<script src="js/map.js?v=21"></script>
<script src="js/pack.js?v=21"></script>
<script src="js/sim.js?v=21"></script>
<script src="js/game.js?v=21"></script>
<script src="js/sprites.js?v=21"></script>
<script src="js/kid.js?v=21"></script>
<script src="js/audio.js?v=21"></script>
<script src="js/music.js?v=21"></script>
<script src="js/render.js?v=21"></script>
<script src="js/ui.js?v=21"></script>
<script src="js/main.js?v=21"></script>
</body>
</html>
